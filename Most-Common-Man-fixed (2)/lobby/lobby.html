<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lobby — Most Common Man</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="lobby.css"
    >

</head>

<body>

<main class="lobby-screen">

    <div class="lobby-decor lobby-star">✦</div>
    <div class="lobby-decor lobby-dot">●</div>

    <section class="lobby-container">

        <header class="lobby-header">

            <p class="eyebrow">
                MOST COMMON MAN
            </p>

            <h1>
                GAME LOBBY
            </h1>

        </header>


        <section
            id="nameSection"
            class="name-section"
        >

            <label for="playerName">
                WHAT'S YOUR NAME?
            </label>

            <input
                id="playerName"
                type="text"
                maxlength="20"
                autocomplete="off"
                placeholder="Enter your name..."
            >

            <p
                id="joinError"
                class="lobby-error"
            ></p>

            <button
                id="joinLobbyButton"
                class="primary-button lobby-button"
                type="button"
            >
                JOIN GAME
            </button>

        </section>


        <section
            id="lobbyContent"
            class="lobby-content hidden"
        >

            <div class="game-code-box">

                <p>
                    GAME CODE
                </p>

                <div
                    id="gameCode"
                    class="game-code"
                >
                    ------
                </div>

                <button
                    id="copyCodeButton"
                    class="copy-code"
                    type="button"
                >
                    COPY CODE
                </button>

            </div>


            <section class="players-section">

                <div class="section-heading">

                    <h2>
                        PLAYERS
                    </h2>

                    <span id="playerCount">
                        0/8
                    </span>

                </div>

                <div
                    id="playersList"
                    class="players-list"
                ></div>

            </section>


            <section
                id="hostSettings"
                class="host-settings hidden"
            >

                <h2>
                    GAME SETTINGS
                </h2>

                <div class="setting">

                    <div>

                        <strong>
                            MODIFIER
                        </strong>

                        <p>
                            Add an extra rule to the whole game.
                        </p>

                    </div>

                    <select id="modifierSelect">

                        <option value="none">
                            None
                        </option>

                        <option value="common-man">
                            Common Man
                        </option>

                        <option value="no-obvious">
                            No Obvious Answers
                        </option>

                        <option value="character">
                            The Character
                        </option>

                        <option value="money-talks">
                            Money Talks
                        </option>

                        <option value="predictive">
                            Predictive Common Man
                        </option>

                    </select>

                </div>

            </section>


            <div class="lobby-actions">

                <button
                    id="startButton"
                    class="primary-button lobby-button"
                    type="button"
                    disabled
                >
                    START GAME
                </button>

                <button
                    id="leaveButton"
                    class="secondary-button lobby-button"
                    type="button"
                >
                    LEAVE
                </button>

            </div>

        </section>

    </section>

</main>


<script
    type="module"
    src="lobby.js"
></script>

</body>
</html>
