<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most Common Man</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>MOST COMMON MAN</h1>

        <p>A GAME OF QUESTIONABLE JUDGEMENT</p>

        <div class="menu">
            <button id="createGame">CREATE GAME</button>
            <button id="joinGame">JOIN GAME</button>
        </div>

        <button id="howToPlay">HOW TO PLAY</button>
    </main>

    <div id="howToPlayModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModal" class="close-button">×</button>

            <h2>HOW TO PLAY</h2>

            <p>
                Everyone answers the same question.
                Then, everyone decides which answers are the most common.
            </p>
        </div>
    </div>

    <footer>
        Inspired by Hamish & Andy
    </footer>

    <script src="script.js"></script>

</body>
</html>
