<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Most Common Man</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="title-screen">

        <div class="decor decoration-one">✦</div>
        <div class="decor decoration-two">●</div>
        <div class="decor decoration-three">✧</div>

        <section class="title-content">

            <p class="eyebrow">A GAME OF QUESTIONABLE JUDGEMENT</p>

            <h1>
                MOST<br>
                COMMON<br>
                <span>MAN</span>
            </h1>

            <p class="subtitle">
                Answer the question.<br>
                Judge your mates.<br>
                Be the Most Common Man.
            </p>

            <div class="menu-buttons">
                <button class="primary-button" onclick="createGame()">
                    CREATE GAME
                </button>

                <button class="secondary-button" onclick="joinGame()">
                    JOIN GAME
                </button>
            </div>

            <button class="how-to-play" onclick="showHowToPlay()">
                How to play?
            </button>

        </section>

        <footer>
            Inspired by Hamish & Andy
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
