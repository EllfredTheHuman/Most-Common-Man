<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lobby — Most Common Man</title>

    <link rel="stylesheet" href="lobby.css">
</head>

<body>

    <main class="lobby">

        <header class="lobby-header">
            <p class="eyebrow">GAME CODE</p>

            <h1 id="gameCode">------</h1>

            <p>Share this code with everyone joining your game.</p>
        </header>

        <section class="players-section">

            <div class="section-header">
                <h2>PLAYERS</h2>
                <span id="playerCount">0 / 8</span>
            </div>

            <div id="playersList" class="players-list">
                <!-- Players are added here by lobby.js -->
            </div>

        </section>

        <div class="lobby-actions">
            <button id="startGame" disabled>
                START GAME
            </button>

            <button id="leaveGame" class="secondary">
                LEAVE GAME
            </button>
        </div>

    </main>

    <div id="loading" class="loading">
        <div class="loading-card">
            <p>CONNECTING...</p>
        </div>
    </div>

    <script type="module" src="lobby.js"></script>

</body>
</html>
